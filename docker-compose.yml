name: begenchgeldyev

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - begenchgeldyev-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: begench
      POSTGRES_PASSWORD: begench
      POSTGRES_DB: begenchgeldyev
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - begenchgeldyev-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8613:8613"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://begench:begench@postgres:5432/begenchgeldyev
    volumes:
      - ./src:/usr/src/app/src
      - ./backend/src:/usr/src/app/backend/src
      - ./backend/site.ts:/usr/src/app/backend/site.ts
    command: ["bun", "--hot", "src/server.ts"]
    depends_on:
      - postgres
    networks:
      - begenchgeldyev-network

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:

networks:
  begenchgeldyev-network:
    driver: bridge
