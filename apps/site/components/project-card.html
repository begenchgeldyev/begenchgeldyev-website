<a href="{{projectHref}}" class="group block md:col-span-6">
  <article
    class="h-full border border-outline-variant/40 bg-surface-container-lowest/70 transition-colors group-hover:border-primary-container/50 group-hover:bg-surface-container-low/70">
    <div class="flex items-center justify-between gap-4 border-b border-outline-variant/30 px-5 py-4">
      <div class="font-mono text-xs uppercase tracking-[0.2em] text-primary-container">[PRJ_{{ accent }}]</div>
      <div class="font-mono text-[11px] uppercase tracking-[0.16em] text-on-surface-variant">{{ visibility }}</div>
    </div>
    {{ imageBlock }}
    <div class="space-y-5 p-5">
      <div class="space-y-3">
        <div class="flex items-start justify-between gap-4">
          <h2 class="font-headline text-2xl font-bold uppercase tracking-tight text-on-surface group-hover:text-primary">
            {{ projectName }}
          </h2>
          <span class="shrink-0 font-mono text-[11px] uppercase tracking-[0.16em] text-on-surface-variant">{{ createdAt }}</span>
        </div>
        <p class="font-mono text-sm leading-7 text-on-surface-variant">{{ description }}</p>
      </div>
      <div class="border border-outline-variant/20 bg-background/70 p-4">
        <div class="mb-3 font-mono text-[11px] uppercase tracking-[0.18em] text-primary-container">
          root@begench:~/projects/{{ projectPath }}
        </div>
        <p class="whitespace-pre-wrap font-mono text-sm leading-7 text-on-surface">{{ content }}</p>
      </div>
      <div class="font-mono text-[11px] uppercase tracking-[0.18em] text-primary-container">Open project dossier -></div>
    </div>
  </article>
</a>
